# Single-node Kafka broker (KRaft, no ZooKeeper) for the kafka() source e2e
# harness.  Clients on the host, including a syslog-ng running inside a dbld
# container with --network=host, reach it at localhost:${KAFKA_PORT:-9092}.
#
# Managed by ./kafka.sh; do not run `docker compose up` by hand unless you also
# wait for the healthcheck.
services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.1}
    container_name: ${KAFKA_CONTAINER:-axosyslog-kafka}
    ports:
      - "${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_PORT:-9092},CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # join consumer groups immediately: the harness restarts syslog-ng a lot
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # scenarios create their topics explicitly, with a known partition count
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KAFKA_PORT:-9092} > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s
